<!DOCTYPE html>
<html lang="ko">
<head>

    <style>

            font-family: 'GmarketSansMedium';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Montserrat', 'Nanum Gothic', sans-serif;
            background-color: #080808;
            color: #1a1a1a;
            overflow-x: hidden;
        }
        .korean-text {
            font-family: 'Nanum Gothic', sans-serif;
        }
        .title-italic-shimmer {

            font-style: italic;
            font-weight: 700;
            font-size: 50px;

            color: transparent;

            background-clip: text;

            border: 2px solid #d4af37;
        }

            background: linear-gradient(135deg, #bf953f 0%, #fc6 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);

            background-clip: text;
            color: transparent;

            font-weight: 700;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
        }
        .gold-accent {
            color: #d4af37;
        }
        textarea::-webkit-scrollbar, div::-webkit-scrollbar {
            width: 6px;
        }

<body class="min-h-screen flex flex-col justify-between items-center py-8 px-4 relative">

    <!-- ☁️ 하얀 구름 모양 패스워드 인증 화면 -->
    <div id="auth-overlay" class="fixed inset-0 bg-[#080808]/95 z-50 flex flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div class="cloud-modal w-full max-w-md p-10 text-center flex flex-col items-center">
            <div class="gold-accent text-3xl mb-3">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="font-serif text-2xl font-bold text-neutral-900 mb-1">Restricted Access</h2>
            <p class="korean-text text-neutral-500 text-xs mb-6 tracking-wide"></p>
            
            <form onsubmit="checkPassword(event)" class="w-full space-y-4">
                <div class="text-left">
                    <label class="block text-xs font-mono uppercase text-amber-700 font-bold mb-1.5 text-center">What is your answer?</label>
                    <input type="password" id="password-input" placeholder="••••" 
                        class="w-full px-4 py-3 text-center tracking-widest text-lg border border-amber-400 rounded-2xl bg-amber-50/30 focus:outline-none focus:border-amber-600 font-mono shadow-inner"
                        required autofocus>
                </div>
                <button type="submit" 
                    class="w-full py-3 bg-neutral-900 border border-amber-600 text-amber-400 font-serif font-bold rounded-2xl hover:bg-amber-600 hover:text-black transition tracking-wider shadow-md">
                    ENTER ARCHIVE
                </button>
            </form>
            <p id="error-msg" class="text-red-500 text-xs mt-3 hidden font-mono">Incorrect answer. Please try again.</p>
        </div>
    </div>

    <!-- 상단 타이틀 -->
    <header class="text-center mb-6">
        <h1 class="title-italic-shimmer"></h1>
    </header>

    <!-- 메인 e-Book 컨테이너 -->
    <main class="w-full max-w-4xl flex flex-col items-center relative">
        
        <!-- 책 본체 -->
        <div id="book-container" class="w-full aspect-[1/1.38] max-w-2xl book-cover rounded-sm p-6 sm:p-10 flex flex-col justify-between transition-all duration-300">
            
            <!-- 페이지 내용 동적 렌더링 영역 -->
            <div id="page-content" class="h-full flex flex-col justify-between relative">
                <!-- Javascript로 동적 주입됨 -->
            </div>

        </div>

        <!-- 하단 네비게이션 및 페이지 컨트롤러 -->
        <div class="w-full max-w-2xl mt-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- 좌측 넘기기 버튼들 -->
            <div class="flex items-center gap-2">
                <button onclick="goToFirst()" title="Jump to Front Cover" class="px-3 py-2 bg-neutral-900 border border-amber-600/50 text-amber-400 rounded hover:bg-amber-600 hover:text-black transition text-sm font-serif">
                    <i class="fa-solid fa-angles-left"></i> First
                </button>
                <button onclick="prevPage()" title="Previous Page" class="px-4 py-2 bg-neutral-900 border border-amber-600/50 text-amber-400 rounded hover:bg-amber-600 hover:text-black transition text-sm font-medium font-serif">
                    <i class="fa-solid fa-chevron-left mr-1"></i> Prev
                </button>
            </div>

            <!-- 가운데 페이지 표시 및 직접 입력 점프 칸 -->
            <div class="flex items-center gap-2 bg-neutral-900 px-4 py-2 rounded border border-amber-600/30 text-amber-300 text-sm">
                <div class="bg-black px-3 py-1 rounded border border-amber-500/50 text-center font-mono">
                    <input type="number" id="current-page-input" min="1" max="103" class="w-12 bg-transparent text-center text-amber-300 focus:outline-none font-bold" onchange="jumpToPage(this.value)">
                </div>
                <span class="text-amber-500 font-bold">/</span>
                <div id="total-pages-box" class="bg-black px-3 py-1 rounded border border-amber-500/30 text-center font-mono text-amber-400 font-bold">
                    103
                </div>
            </div>

            <!-- 우측 넘기기 버튼들 -->
            <div class="flex items-center gap-2">
                <button onclick="nextPage()" title="Next Page" class="px-4 py-2 bg-neutral-900 border border-amber-600/50 text-amber-400 rounded hover:bg-amber-600 hover:text-black transition text-sm font-medium font-serif">
                    Next <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
                <button onclick="goToLast()" title="Jump to Back Cover" class="px-3 py-2 bg-neutral-900 border border-amber-600/50 text-amber-400 rounded hover:bg-amber-600 hover:text-black transition text-sm font-serif">
                    Last <i class="fa-solid fa-angles-right"></i>
                </button>
            </div>

        </div>

        <!-- 🕵️‍♂️ 평소엔 숨겨져 있다가 아래 푸터를 누르면 나타나는 나만의 백업/복원 패널 -->
        <div id="admin-backup-panel" class="w-full max-w-2xl mt-4 flex items-center justify-center gap-3 hidden">
            <button onclick="backupData()" class="px-4 py-2 bg-neutral-900 border border-amber-600 text-amber-400 rounded-lg hover:bg-amber-600 hover:text-black transition text-xs font-mono tracking-wider shadow">
                <i class="fa-solid fa-download mr-1.5"></i> 백업 파일 다운로드
            </button>
            <label class="px-4 py-2 bg-neutral-900 border border-amber-600 text-amber-400 rounded-lg hover:bg-amber-600 hover:text-black transition text-xs font-mono tracking-wider shadow cursor-pointer">
                <i class="fa-solid fa-upload mr-1.5"></i> 백업 파일 불러오기
                <input type="file" id="import-file" accept=".json" onchange="restoreData(event)" class="hidden">
            </label>
        </div>

    </main>

    <!-- 하단 푸터 (이 글씨를 누르면 백업 버튼이 나타납니다!) -->
    <footer onclick="toggleAdminPanel()" class="mt-8 text-xs text-neutral-500 font-mono tracking-widest uppercase text-center cursor-pointer hover:text-amber-500 transition" title="Secret Admin Trigger">
    SECURE LINK SHARING SYSTEM
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        const CORRECT_PASSWORD = "20241215";

        function checkPassword(event) {
            event.preventDefault();
            const inputVal = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');
            const overlay = document.getElementById('auth-overlay');

            if (inputVal === CORRECT_PASSWORD) {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 300);
                sessionStorage.setItem('archive_authenticated', 'true');
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('password-input').value = '';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('archive_authenticated') === 'true') {
                document.getElementById('auth-overlay').style.display = 'none';
            }
        });

        function toggleAdminPanel() {
            const panel = document.getElementById('admin-backup-panel');
            panel.classList.toggle('hidden');
        }

        const TOTAL_PAGES = 103; 
        let currentPage = 0;

        function backupData() {
            saveCurrentPageContent();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(proposalData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `refrigerator_proposals_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (typeof importedData === 'object' && importedData !== null) {
                        proposalData = importedData;
                        localStorage.setItem('royal_kitchen_archive_v4', JSON.stringify(proposalData));
                        renderPage();
                        alert("백업 파일이 성공적으로 복원되었습니다!");
                    } else {
                        alert("올바르지 않은 형식의 파일입니다.");
                    }
                } catch (err) {
                    alert("JSON 파일을 읽는 중 오류가 발생했습니다.");
                }
            };
            reader.readAsText(file);
        }

        function renderPage() {
            const container = document.getElementById('page-content');
            const pageInput = document.getElementById('current-page-input');
            pageInput.value = currentPage + 1;

            if (currentPage === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col justify-between p-6 sm:p-10 bg-white relative overflow-hidden">
                        <div class="absolute bottom-[-10px] left-[-10px] w-36 sm:w-44 aspect-square pointer-events-none opacity-90 mix-blend-multiply" style="mask-image: radial-gradient(circle, black 45%, transparent 80%); -webkit-mask-image: radial-gradient(circle, black 45%, transparent 80%); filter: saturate(1.3) hue-rotate(5deg) blur(0.2px);">
                            <img src="https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcRGV7u1xIKbNkEHbdjdMT3D67YRke-TAmN0CGL2eeRdwDn-LzZQ50r5V42yDrMCCEJQnM59zGWl9m73TwQ" alt="Dreamy watercolor fruit baskets and tulips illustration" class="w-full h-full object-cover rounded-full">
                        </div>

                        <div class="flex justify-between items-center gold-accent text-3xl mt-4">
                            <i class="fa-solid fa-utensils"></i>
                        </div>
                        <div class="space-y-3 text-right pt-4 sm:pt-6">
                            <p class="gold-foil-text uppercase tracking-widest text-xs font-semibold"></p>
                            <h2 class="gold-foil-text text-4xl sm:text-6xl font-extrabold tracking-wide py-1 italic" style="font-family: 'Restora', serif; font-weight: bold;">For Our Refrigerator</h2>
                            <div class="w-20 h-[2px] bg-amber-500 ml-auto mt-3"></div>
                            <div class="gold-foil-text font-bold pt-2" style="font-family: 'GmarketSansMedium', sans-serif; font-size: 15pt;">냉장고를 부탁해</div>
                        </div>
                        <div class="flex justify-end items-end mb-[-24px]">
                            <div class="text-right pr-1">
                                <span class="gold-foil-text font-serif italic text-xl">-by. J</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentPage === 1) {
                container.innerHTML = `
                    <div class="h-full flex flex-col justify-center items-center p-8 text-center space-y-6 bg-white">
                        <span class="gold-accent text-4xl"><i class="fa-solid fa-book-bookmark"></i></span>
                        <h2 class="korean-text font-bold text-2xl sm:text-3xl text-neutral-900 leading-snug" style="font-family: 'GmarketSansMedium', sans-serif; color: #c5a059;">
                            '냉장고를 부탁해 기획 아이디어 100'
                        </h2>
                        <div class="w-16 h-[1px] bg-amber-400 mt-4"></div>
                    </div>
                `;
            } else if (currentPage >= 2 && currentPage <= 101) {
                const pageNum = currentPage - 1; 
                const item = proposalData[currentPage] || { title: ``, intent: ``, format: ``, vcr: `` };

                container.innerHTML = `
                    <div class="h-full flex flex-col justify-between p-5 sm:p-7 bg-white/95">
                        <div class="flex justify-between items-center border-b border-amber-300 pb-3">
                            <div class="flex items-center gap-2 gold-accent font-serif text-xs tracking-wider uppercase font-bold">
                                <i class="fa-solid fa-star"></i> <span>Cooking Variety Format</span>
                            </div>
                            <span class="font-mono text-xs text-amber-900 font-bold bg-amber-100 px-2.5 py-1 rounded border border-amber-300">
                                PROPOSAL NO. ${pageNum} / 100
                            </span>
                        </div>

                        <div class="flex-grow flex flex-col my-3 space-y-3 overflow-y-auto pr-1">
                            <div>
                                <label class="block text-[11px] font-mono uppercase text-amber-700 font-bold mb-1">Title / Subject</label>
                                <input type="text" id="prop-title-${currentPage}" value="${item.title}" 
                                    class="korean-text font-bold text-base sm:text-lg text-neutral-900 w-full border-b border-amber-300 pb-1 bg-transparent focus:outline-none focus:border-amber-600"
                                    placeholder="기획안 제목을 입력하세요" oninput="saveCurrentPageContent()">
                            </div>

                            <div class="grid grid-cols-1 gap-3 flex-grow">
                                <div class="flex flex-col flex-grow">
                                    <label class="block text-[10px] font-mono uppercase text-amber-700 font-bold mb-1">1. Planning Intention (기획의도)</label>
                                    <textarea id="prop-intent-${currentPage}" 
                                        class="korean-text w-full text-xs sm:text-sm text-neutral-800 bg-amber-50/40 p-2.5 rounded border border-amber-200 focus:outline-none focus:border-amber-500 resize-none flex-grow min-h-[90px] leading-relaxed"
                                        placeholder="기획의도를 입력하세요..." oninput="saveCurrentPageContent()">${item.intent}</textarea>
                                </div>

                                <div class="flex flex-col flex-grow">
                                    <label class="block text-[10px] font-mono uppercase text-amber-700 font-bold mb-1">2. Program Format (프로그램 형식)</label>
                                    <textarea id="prop-format-${currentPage}" 
                                        class="korean-text w-full text-xs sm:text-sm text-neutral-800 bg-amber-50/40 p-2.5 rounded border border-amber-200 focus:outline-none focus:border-amber-500 resize-none flex-grow min-h-[90px] leading-relaxed"
                                        placeholder="프로그램 형식을 입력하세요..." oninput="saveCurrentPageContent()">${item.format}</textarea>
                                </div>

                                <div class="flex flex-col flex-grow">
                                    <label class="block text-[10px] font-mono uppercase text-amber-700 font-bold mb-1">3. Segment & VCR Details (회차별 코너 및 VCR 구성)</label>
                                    <textarea id="prop-vcr-${currentPage}" 
                                        class="korean-text w-full text-xs sm:text-sm text-neutral-800 bg-amber-50/40 p-2.5 rounded border border-amber-200 focus:outline-none focus:border-amber-500 resize-none flex-grow min-h-[90px] leading-relaxed"
                                        placeholder="코너 구성 및 VCR 포인트를 입력하세요..." oninput="saveCurrentPageContent()">${item.vcr}</textarea>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-between items-center text-[11px] text-neutral-500 font-mono pt-2 border-t border-amber-100">
                            <span><i class="fa-solid fa-cloud-arrow-up text-amber-600 mr-1"></i> Auto-saved to browser storage</span>
                            <span class="gold-accent italic font-serif">Curated Edition</span>
                        </div>
                    </div>
                `;
            } else if (currentPage === 102) {
                container.innerHTML = `
                    <div class="h-full flex flex-col justify-between p-8 text-center items-center bg-white">
                        <div class="flex justify-center items-center gold-accent text-3xl my-auto">
                            <i class="fa-solid fa-utensils"></i>
                        </div>
                        <div class="w-20 h-[2px] bg-amber-500 mx-auto my-auto"></div>
                        <div class="gold-foil-text text-xs tracking-widest uppercase font-serif pb-4">
                            End of Archive
                        </div>
                    </div>
                `;
            }
        }

        function nextPage() {
            saveCurrentPageContent();
            if (currentPage < TOTAL_PAGES - 1) {
                currentPage++;
                renderPage();
            }
        }

        function prevPage() {
            saveCurrentPageContent();
            if (currentPage > 0) {
                currentPage--;
                renderPage();
            }
        }

        function goToFirst() {
            saveCurrentPageContent();
            currentPage = 0;
            renderPage();
        }

        function goToLast() {
            saveCurrentPageContent();
            currentPage = TOTAL_PAGES - 1;
            renderPage();
        }

        function jumpToPage(val) {
            saveCurrentPageContent();
            let target = parseInt(val) - 1;
            if (target >= 0 && target < TOTAL_PAGES) {
                currentPage = target;
                renderPage();
            } else {
                alert(`Please enter a valid page number between 1 and ${TOTAL_PAGES}.`);
                renderPage();
            }
        }

        renderPage();
    </script>
</body>
</html>
